version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
    ignore:
      # Major upgrades (new framework, JDK or Node majors) are planned work, not weekly bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
